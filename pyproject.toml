[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "taskmonitor"
version = "1.0.0"
description = "Desktop activity monitor with AI analytics and visualization"
authors = [{ name = "Aidan" }]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "tensorflow>=2.14.0",
    "dbus-python>=1.3.2",
]

[project.scripts]
taskmonitor = "taskmonitor.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskmonitor*"]

[tool.setuptools.package-data]
taskmonitor = ["assets/*", "autostart/*"]